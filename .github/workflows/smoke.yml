name: Smoke Tests

# Level-3 end-to-end smoke tests (tiny MCMC, ~1 h). Weekly, to catch upstream
# EMC2 changes that break the real MCMC path (EMC2 is not pinned), plus manual
# dispatch before releases or after major model changes.
on:
  schedule:
    - cron: "0 4 * * 0"   # Sundays 04:00 UTC, after the nightly L2 run
  workflow_dispatch:

jobs:
  smoke-tests:
    name: "L3 · fit smoke tests"
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Cache R packages (L2 deps, reused by smoke)
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-l2-${{ runner.os }}-${{ hashFiles('.github/r-deps-level2.txt') }}
          restore-keys: r-l2-${{ runner.os }}-

      - name: Install dependencies
        run: Rscript -e "install.packages('pak', repos='https://r-lib.github.io/p/pak/stable/'); pak::pkg_install(readLines('.github/r-deps-level2.txt'))"

      - name: Run smoke tests
        env:
          TEST_LEVEL: "3"
        run: Rscript __tests__/run_tests.R
