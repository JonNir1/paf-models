AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  PAF AWS Batch: spot (default) and on-demand compute environments that scale to zero,
  one queue each, the paf-job definition (image pinned by digest, prefix-scoped job role,
  spot-reclaim retries), a 30-day log group, and a reaper Lambda that terminates jobs
  running longer than MaxJobSeconds and paf instances older than MaxInstanceDays.
  Keyless: no key pair, egress-only security group (HTTPS), IMDSv2 with hop limit 1 so
  containers cannot reach the instance role. Deploy from AWS CloudShell as an admin.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the instances (the default VPC is fine).
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets (auto-assign public IPv4) in that VPC; list several AZs.
  ImageUri:
    Type: String
    Description: Job image pinned by digest, e.g. ghcr.io/jonnir1/paf-r@sha256:<64 hex>.
    AllowedPattern: "^ghcr\\.io/jonnir1/paf-r@sha256:[0-9a-f]{64}$"
  BucketName:
    Type: String
    Default: jon-nir
  BucketPrefix:
    Type: String
    Default: paf-models
    AllowedPattern: "^[A-Za-z0-9._-]+$"
  SpotInstanceTypes:
    Type: CommaDelimitedList
    Default: "c6a.4xlarge,c5.xlarge"
  OnDemandInstanceTypes:
    Type: CommaDelimitedList
    Default: "c6a.4xlarge"
  MaxSpotVcpus:
    Type: Number
    Default: 64
    MinValue: 0
    MaxValue: 64
    Description: Hard cap on concurrent spot vCPUs (spot quota is 64).
  MaxOnDemandVcpus:
    Type: Number
    Default: 16
    MinValue: 0
    MaxValue: 16
    Description: Hard cap on concurrent on-demand vCPUs (quota is 16).
  MaxJobSeconds:
    Type: Number
    Default: 172800
    MinValue: 600
    MaxValue: 1209600
    Description: Default per-attempt job timeout (48 h) and the reaper running-job cap, in seconds.
  MaxInstanceDays:
    Type: Number
    Default: 7
    MinValue: 1
    Description: Reaper terminates any Project=paf instance older than this (last-resort backstop).

Resources:
  # ---------------------------------------------------------------- Network
  BatchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: paf-batch-sg
      GroupDescription: PAF Batch instances - no inbound, HTTPS outbound only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS (AWS APIs, S3, GitHub, GHCR)
      Tags:
        - Key: Project
          Value: paf

  # ---------------------------------------------------------------- Roles
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: paf-batch-instance-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Project
          Value: paf

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: paf-batch-instance-profile
      Roles:
        - !Ref InstanceRole

  JobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: paf-batch-job-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: paf-s3-prefix
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListPrefix
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${BucketName}"
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Sub "${BucketPrefix}"
                      - !Sub "${BucketPrefix}/*"
              - Sid: ReadWritePrefix
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${BucketName}/${BucketPrefix}/*"
              - Sid: NoDeletes
                Effect: Deny
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource: !Sub "arn:aws:s3:::${BucketName}/*"
      Tags:
        - Key: Project
          Value: paf

  # ---------------------------------------------------------------- Compute
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: paf-batch-lt
      LaunchTemplateData:
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 40
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true

  SpotComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: paf-spot-ce
      Type: MANAGED
      State: ENABLED
      ReplaceComputeEnvironment: false
      UpdatePolicy:
        TerminateJobsOnUpdate: false
        JobExecutionTimeoutMinutes: 30
      ComputeResources:
        Type: SPOT
        AllocationStrategy: SPOT_PRICE_CAPACITY_OPTIMIZED
        MinvCpus: 0
        MaxvCpus: !Ref MaxSpotVcpus
        InstanceTypes: !Ref SpotInstanceTypes
        Subnets: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref BatchSecurityGroup
        InstanceRole: !GetAtt InstanceProfile.Arn
        LaunchTemplate:
          LaunchTemplateId: !Ref LaunchTemplate
          Version: !GetAtt LaunchTemplate.LatestVersionNumber
        Ec2Configuration:
          - ImageType: ECS_AL2023
        Tags:
          Project: paf
          Owner: batch
          Market: spot
      Tags:
        Project: paf

  OnDemandComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: paf-ondemand-ce
      Type: MANAGED
      State: ENABLED
      ReplaceComputeEnvironment: false
      UpdatePolicy:
        TerminateJobsOnUpdate: false
        JobExecutionTimeoutMinutes: 30
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MinvCpus: 0
        MaxvCpus: !Ref MaxOnDemandVcpus
        InstanceTypes: !Ref OnDemandInstanceTypes
        Subnets: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref BatchSecurityGroup
        InstanceRole: !GetAtt InstanceProfile.Arn
        LaunchTemplate:
          LaunchTemplateId: !Ref LaunchTemplate
          Version: !GetAtt LaunchTemplate.LatestVersionNumber
        Ec2Configuration:
          - ImageType: ECS_AL2023
        Tags:
          Project: paf
          Owner: batch
          Market: on-demand
      Tags:
        Project: paf

  SpotQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: paf-spot
      Priority: 1
      State: ENABLED
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref SpotComputeEnvironment
      JobStateTimeLimitActions:
        - Action: CANCEL
          State: RUNNABLE
          MaxTimeSeconds: 600
          Reason: "MISCONFIGURATION:JOB_RESOURCE_REQUIREMENT"
      Tags:
        Project: paf

  OnDemandQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: paf-ondemand
      Priority: 1
      State: ENABLED
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref OnDemandComputeEnvironment
      JobStateTimeLimitActions:
        - Action: CANCEL
          State: RUNNABLE
          MaxTimeSeconds: 600
          Reason: "MISCONFIGURATION:JOB_RESOURCE_REQUIREMENT"
      Tags:
        Project: paf

  JobLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/batch/job
      RetentionInDays: 30

  JobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: paf-job
      Type: container
      PlatformCapabilities:
        - EC2
      PropagateTags: true
      Timeout:
        AttemptDurationSeconds: !Ref MaxJobSeconds
      RetryStrategy:
        Attempts: 3
        EvaluateOnExit:
          - OnStatusReason: "Host EC2*"
            Action: RETRY
          - OnReason: "*"
            Action: EXIT
      ContainerProperties:
        Image: !Ref ImageUri
        JobRoleArn: !GetAtt JobRole.Arn
        ResourceRequirements:
          - Type: VCPU
            Value: "16"
          - Type: MEMORY
            Value: "28000"
        Environment:
          - Name: BUCKET
            Value: !Sub "${BucketName}/${BucketPrefix}"
          - Name: CLOUD
            Value: aws
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
        LinuxParameters:
          InitProcessEnabled: true
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref JobLogGroup
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: paf
      Tags:
        Project: paf

  # ---------------------------------------------------------------- Reaper
  ReaperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/paf-reaper
      RetentionInDays: 30

  ReaperRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: paf-reaper-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: paf-reaper
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - batch:ListJobs
                  - ec2:DescribeInstances
                Resource: "*"
              - Effect: Allow
                Action: batch:TerminateJob
                Resource: !Sub "arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job/*"
              - Effect: Allow
                Action: ec2:TerminateInstances
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: paf
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${ReaperLogGroup.Arn}:*"
      Tags:
        - Key: Project
          Value: paf

  ReaperFunction:
    Type: AWS::Lambda::Function
    DependsOn: ReaperLogGroup
    Properties:
      FunctionName: paf-reaper
      Runtime: python3.12
      Handler: index.handler
      Timeout: 120
      MemorySize: 128
      Role: !GetAtt ReaperRole.Arn
      Environment:
        Variables:
          QUEUES: "paf-spot,paf-ondemand"
          MAX_JOB_SECONDS: !Ref MaxJobSeconds
          MAX_INSTANCE_DAYS: !Ref MaxInstanceDays
      Code:
        ZipFile: |
          import datetime
          import os
          import time
          import boto3
          from botocore.exceptions import ClientError

          batch = boto3.client("batch")
          ec2 = boto3.client("ec2")


          def _reap_jobs(max_seconds):
              cutoff_ms = (time.time() - max_seconds) * 1000
              max_hours = max_seconds / 3600
              killed = []
              for q in [n for n in os.environ["QUEUES"].split(",") if n]:
                  try:
                      pages = batch.get_paginator("list_jobs").paginate(jobQueue=q, jobStatus="RUNNING")
                      for page in pages:
                          for job in page["jobSummaryList"]:
                              started = job.get("startedAt")
                              if started and started < cutoff_ms:
                                  batch.terminate_job(jobId=job["jobId"],
                                                      reason=f"paf reaper: running > {max_hours:g} h")
                                  killed.append(job["jobId"])
                  except ClientError as e:
                      print(f"queue {q}: {e}")
              return killed


          def _reap_instances(max_days):
              cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=max_days)
              filters = [{"Name": "tag:Project", "Values": ["paf"]},
                         {"Name": "instance-state-name", "Values": ["pending", "running", "stopping", "stopped"]}]
              old = []
              for page in ec2.get_paginator("describe_instances").paginate(Filters=filters):
                  for res in page["Reservations"]:
                      old += [i["InstanceId"] for i in res["Instances"] if i["LaunchTime"] < cutoff]
              if old:
                  ec2.terminate_instances(InstanceIds=old)
              return old


          def handler(event, context):
              jobs = _reap_jobs(float(os.environ["MAX_JOB_SECONDS"]))
              instances = _reap_instances(float(os.environ["MAX_INSTANCE_DAYS"]))
              print(f"terminated jobs={jobs} instances={instances}")
              return {"jobs": jobs, "instances": instances}
      Tags:
        - Key: Project
          Value: paf

  ReaperSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: paf-reaper-every-30-min
      ScheduleExpression: rate(30 minutes)
      State: ENABLED
      Targets:
        - Id: paf-reaper
          Arn: !GetAtt ReaperFunction.Arn

  ReaperPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReaperFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ReaperSchedule.Arn

Outputs:
  SpotQueue:
    Value: !Ref SpotQueue
  OnDemandQueue:
    Value: !Ref OnDemandQueue
  JobDefinition:
    Value: !Ref JobDefinition
  JobRoleArn:
    Value: !GetAtt JobRole.Arn
  SecurityGroupId:
    Value: !Ref BatchSecurityGroup
